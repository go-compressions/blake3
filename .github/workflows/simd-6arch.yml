name: simd-6arch
on:
  push:
    branches: [main]
  pull_request:

# Validate the go-asmgen SIMD BLAKE3 path (default `go build`, no GOEXPERIMENT)
# on all six 64-bit Go targets: native amd64 + arm64, and riscv64 + loong64 +
# ppc64le + s390x under qemu on Debian. mix4/compress4 correctness and the full
# official vectors all run through the asm kernel. s390x is big-endian, so its
# pass proves the digest is bit-exact across endianness.
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go env GOARCH
      - run: go vet ./...
      - run: go test -v ./...

  emulated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: riscv64, image: "debian:trixie", qemu: "rv64,v=true,vlen=128" }
          - { arch: loong64, image: "ghcr.io/loong64/debian:trixie", qemu: "la464" }
          - { arch: ppc64le, image: "debian:trixie", qemu: "power9" }
          - { arch: s390x, image: "debian:trixie", qemu: "qemu" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Register qemu binfmt handlers
        run: docker run --privileged --rm tonistiigi/binfmt --install all
      - name: Cross-compile the test binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go test -c -o /tmp/blake3.test .
      - name: Run the suite under qemu (Debian)
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} \
            -e QEMU_CPU=${{ matrix.qemu }} -v /tmp:/t ${{ matrix.image }} \
            /t/blake3.test -test.v -test.timeout 600s
