name: bench-mix4
on:
  push:
    branches: [experiment/asmgen-neon]
jobs:
  bench:
    runs-on: ubuntu-latest # native amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go env GOARCH
      - name: BLAKE3 mixing + chunk-CV throughput (SSE vs scalar)
        run: go test -run '^$' -bench 'Mix4|FillChunkCVs' -benchmem -count=4 .
