name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: lint + build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Taskfile ci
        run: task ci

      # ⛔ THE PURE-GO FALLBACK WAS COMPILED BY NOTHING. blake3_generic.go sits
      # behind `!arm64 && !amd64 && !loong64 && !riscv64 && !ppc64le && !s390x`
      # -- the six architectures every other lane covers -- so no job here
      # built it, and buildscan named it for the same reason it named
      # blake3_simd_arm64.go. `go vet` cross-compiles, so three configurations
      # cost seconds and no runner.
      #
      # ⛔ IN THE WORKFLOW, NOT THE TASKFILE, and that is the whole decision.
      # `task ci` is where lint, build and test live, and a configuration
      # declared inside a Taskfile is invisible to every instrument that reads
      # workflows -- the same blindness testscan reports for a `go test $PKGS`.
      # A platform nobody can SEE being covered is one step from a platform
      # nobody covers. One step per configuration, for the same reason.
      - name: vet the generic fallback, 386
        run: GOOS=linux GOARCH=386 go vet ./...
      - name: vet the generic fallback, arm
        run: GOOS=linux GOARCH=arm go vet ./...
      - name: vet the generic fallback, js/wasm
        run: GOOS=js GOARCH=wasm go vet ./...

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: cover.out
          if-no-files-found: ignore

  # ⛔ BOTH ARCHITECTURES, because the conjunction is what was missing.
  #
  # This job was amd64 only, and simd-6arch.yml says in its own header "no
  # GOEXPERIMENT". So `//go:build goexperiment.simd && arm64` was satisfied by
  # NO job: each half covered, their conjunction never. blake3_simd_arm64.go
  # stopped compiling when the experimental API renamed TransposeEven/Odd and
  # AsUint64x2, and nothing said so for eleven days -- the CI stayed green
  # because no configuration that could fail existed. Found by hand on an arm64
  # laptop, then named by go-fleettools/buildscan, which exists to answer
  # exactly this question.
  #
  # A matrix rather than a second job, so the two legs cannot drift apart.
  simd:
    name: experimental SIMD (${{ matrix.arch }}, GOEXPERIMENT=simd)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true

      # Builds the experimental SIMD chunk kernel for this architecture --
      # blake3_simd_amd64.go on AVX2, blake3_simd_arm64.go on NEON, both Go
      # 1.27's simd/archsimd intrinsics with no cgo and no assembly -- and runs
      # the full suite against the official BLAKE3 vectors on a real CPU. These
      # paths are not held to the 100% gate (the no-AVX2 fallback branch is
      # unreachable on an AVX2 runner); the pure-Go `ci` job above is the gated
      # build.
      - name: Vet + test under GOEXPERIMENT=simd
        env:
          GOEXPERIMENT: simd
        run: |
          go env GOARCH
          go vet ./...
          go test -race -v ./...
