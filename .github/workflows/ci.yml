name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: lint + build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Taskfile ci
        run: task ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: cover.out
          if-no-files-found: ignore

  simd:
    name: experimental SIMD (amd64, GOEXPERIMENT=simd)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      # Builds the experimental amd64 SIMD chunk kernel (blake3_simd_amd64.go,
      # Go 1.26's simd/archsimd intrinsics, no cgo/assembly) and runs the full
      # suite against the official BLAKE3 vectors on a real AVX2 CPU. This path
      # is not held to the 100% gate (the no-AVX2 fallback branch is unreachable
      # on an AVX2 runner); the pure-Go `ci` job above is the gated build.
      - name: Vet + test under GOEXPERIMENT=simd
        env:
          GOEXPERIMENT: simd
        run: |
          go vet ./...
          go test -race -v ./...
