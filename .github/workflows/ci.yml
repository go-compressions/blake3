name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: lint + build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.20'
          check-latest: true
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Taskfile ci
        run: task ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: cover.out
          if-no-files-found: ignore

  simd:
    name: experimental SIMD (amd64, GOEXPERIMENT=simd)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      # Builds the experimental amd64 SIMD chunk kernel (blake3_simd_amd64.go,
      # Go 1.26's simd/archsimd intrinsics, no cgo/assembly) and runs the full
      # suite against the official BLAKE3 vectors on a real AVX2 CPU. This path
      # is not held to the 100% gate (the no-AVX2 fallback branch is unreachable
      # on an AVX2 runner); the pure-Go `ci` job above is the gated build.
      - name: Vet + test under GOEXPERIMENT=simd
        env:
          GOEXPERIMENT: simd
        run: |
          go vet ./...
          go test -race -v ./...

  emulated:
    # Run the official-BLAKE3-vector suite on the non-amd64 architectures whose
    # SIMD mix4 kernel ships as hand-written assembly (mix4_{s390x,ppc64le,
    # riscv64,loong64}.s, all active in the default !goexperiment.simd build).
    # Without this, an arch-specific bug -- e.g. a big-endian mistake in the
    # s390x kernel -- would never be exercised against the reference vectors,
    # because the ci/simd jobs above only run on amd64.
    name: emulated vectors
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: riscv64, image: "debian:trixie",                 qemu: "rv64,v=true,vlen=128" }
          - { arch: loong64, image: "ghcr.io/loong64/debian:trixie", qemu: "la464" }
          - { arch: ppc64le, image: "debian:trixie",                 qemu: "power9" }
          - { arch: s390x,   image: "debian:trixie",                 qemu: "qemu" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
      - run: docker run --privileged --rm tonistiigi/binfmt --install all
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go test -c -o /tmp/b3.test .
      - run: docker run --rm --platform linux/${{ matrix.arch }} -e QEMU_CPU=${{ matrix.qemu }} -v /tmp:/t ${{ matrix.image }} /t/b3.test -test.v
