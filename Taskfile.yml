version: '3'

# This Taskfile runs the same way inside the monorepo (where `go.work`
# at the repo root resolves the module locally) and inside the
# standalone github.com/go-compressions/lzfse repo (where no
# `go.work` exists and Go falls back to the module proxy).

tasks:
  build:
    desc: "Build the module"
    cmds:
      - go build ./...

  test:
    desc: "Run tests with coverage and enforce 100%"
    cmds:
      - go test -race -coverprofile=cover.out ./...
      - go tool cover -func=cover.out
      - |
        pct=$(go tool cover -func=cover.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
        echo "coverage: ${pct}%"
        awk "BEGIN{ exit !(${pct} >= 100.0) }" || { echo "coverage ${pct}% < 100.0%"; exit 1; }

  lint:
    desc: "Vet the module and check it is gofmt-clean"
    cmds:
      - go vet ./...
      # ⛔ NOTHING CHECKED THE FORMATTING, here or in the workflow, and
      # mix4_vsx_gen.go had drifted on main with nobody told. Put in `lint`
      # rather than in the workflow so that `task lint` catches it before a
      # push, which is where a formatting miss belongs.
      #
      # The drift is NAMED, not just counted: a gate that says "not clean"
      # without saying which file sends its reader to run gofmt themselves.
      - |
        drift=$(gofmt -l .)
        if [ -n "$drift" ]; then echo "::error::not gofmt-clean:"; echo "$drift"; exit 1; fi

  ci:
    desc: "Run lint + build + test (used by the GitHub Actions workflow)"
    cmds:
      - task: lint
      - task: build
      - task: test
